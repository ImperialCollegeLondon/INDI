name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  install-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install package and dev dependencies
        run: uv sync --locked

      - name: Run pytest
        run: uv run pytest
