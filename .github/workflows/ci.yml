name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  install-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@10

      - name: Install the project
        run: uv sync --locked --group dev --group doc

      - name: Run tests
        run: uv run pytest

